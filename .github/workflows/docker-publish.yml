name: Publish Docker image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing published release version (X.Y.Z)
        required: true
        type: string

permissions:
  contents: read

jobs:
  docker-publish:
    uses: ROBOTIS-GIT/github_workflows/.github/workflows/docker-publish.yml@main
    with:
      image: robotis/open-manipulator
      version: ${{ inputs.version }}
      checkout_ref: jazzy
      context: .
      dockerfile: ./docker/Dockerfile
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
